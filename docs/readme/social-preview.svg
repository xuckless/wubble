<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <title>wubble: a Chromium-based browser where the whole window is one scene</title>
  <defs>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC8FF"/><stop offset=".36" stop-color="#B8A6FF"/>
      <stop offset=".68" stop-color="#FF9ED8"/><stop offset="1" stop-color="#8AF2D0"/>
    </linearGradient>
    <radialGradient id="bg" cx=".2" cy=".15" r="1.1">
      <stop offset="0" stop-color="#1B2033"/><stop offset=".6" stop-color="#0F111A"/><stop offset="1" stop-color="#080910"/>
    </radialGradient>
    <radialGradient id="blobA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7CC8FF" stop-opacity=".45"/><stop offset="1" stop-color="#7CC8FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF9ED8" stop-opacity=".38"/><stop offset="1" stop-color="#FF9ED8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8AF2D0" stop-opacity=".3"/><stop offset="1" stop-color="#8AF2D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="win"><rect x="660" y="96" width="560" height="448" rx="28"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="820" cy="150" r="260" fill="url(#blobA)"/>
  <circle cx="1130" cy="470" r="280" fill="url(#blobB)"/>
  <circle cx="720" cy="560" r="220" fill="url(#blobC)"/>

  <!-- the window: one scene -->
  <g clip-path="url(#win)">
    <rect x="660" y="96" width="560" height="448" fill="#0B0C12" fill-opacity=".55"/>
    <circle cx="960" cy="260" r="170" fill="url(#blobA)"/>
    <circle cx="1100" cy="430" r="190" fill="url(#blobB)"/>
    <!-- page -->
    <rect x="908" y="128" width="308" height="384" rx="18" fill="#FFFFFF" fill-opacity=".92"/>
    <rect x="908" y="156" width="150" height="14" rx="7" fill="#12141C" fill-opacity=".85"/>
    <rect x="908" y="188" width="260" height="8" rx="4" fill="#12141C" fill-opacity=".18"/>
    <rect x="908" y="208" width="230" height="8" rx="4" fill="#12141C" fill-opacity=".18"/>
    <rect x="908" y="228" width="244" height="8" rx="4" fill="#12141C" fill-opacity=".18"/>
    <rect x="908" y="262" width="260" height="150" rx="12" fill="url(#film)" fill-opacity=".55"/>
    <rect x="908" y="432" width="200" height="8" rx="4" fill="#12141C" fill-opacity=".18"/>
    <rect x="908" y="452" width="220" height="8" rx="4" fill="#12141C" fill-opacity=".18"/>
    <!-- glass sidebar over the page -->
    <rect x="680" y="116" width="212" height="408" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="696" y="136" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".25"/>
    <rect x="712" y="149" width="96" height="8" rx="4" fill="#FFFFFF" fill-opacity=".55"/>
    <g fill="#FFFFFF">
      <rect x="696" y="196" width="180" height="32" rx="12" fill-opacity=".2"/>
      <circle cx="716" cy="212" r="7" fill="url(#film)"/><rect x="732" y="208" width="110" height="8" rx="4" fill-opacity=".7"/>
      <circle cx="716" cy="252" r="7" fill-opacity=".35"/><rect x="732" y="248" width="86" height="8" rx="4" fill-opacity=".4"/>
      <circle cx="716" cy="292" r="7" fill-opacity=".35"/><rect x="732" y="288" width="120" height="8" rx="4" fill-opacity=".4"/>
      <circle cx="716" cy="332" r="7" fill-opacity=".35"/><rect x="732" y="328" width="70" height="8" rx="4" fill-opacity=".4"/>
    </g>
    <circle cx="718" cy="494" r="9" fill="#7CC8FF"/><circle cx="748" cy="494" r="9" fill="#B8A6FF"/><circle cx="778" cy="494" r="9" fill="#FF9ED8"/>
  </g>
  <rect x="660" y="96" width="560" height="448" rx="28" fill="none" stroke="url(#film)" stroke-width="2" stroke-opacity=".8"/>

  <!-- text -->
  <image x="64" y="150" width="440" height="137" xlink:href="data:image/svg+xml;base64,"/>
  <text x="64" y="352" font-family="Open Sans, Liberation Sans, sans-serif" font-weight="700" font-size="34" fill="#F2F4FA">The whole window is one scene.</text>
  <text x="64" y="404" font-family="Open Sans, Liberation Sans, sans-serif" font-size="26" fill="#B9BFD3">A Chromium-based browser with a Slint shell.</text>
  <text x="64" y="442" font-family="Open Sans, Liberation Sans, sans-serif" font-size="26" fill="#B9BFD3">Vertical tabs, Spaces, split view, GPU glass.</text>
  <g font-family="Open Sans, Liberation Sans, sans-serif" font-size="20" fill="#F2F4FA">
    <rect x="64" y="496" width="92" height="40" rx="20" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/><text x="110" y="523" text-anchor="middle">Rust</text>
    <rect x="168" y="496" width="92" height="40" rx="20" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/><text x="214" y="523" text-anchor="middle">Slint</text>
    <rect x="272" y="496" width="92" height="40" rx="20" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/><text x="318" y="523" text-anchor="middle">wgpu</text>
    <rect x="376" y="496" width="132" height="40" rx="20" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/><text x="442" y="523" text-anchor="middle">GPL-3.0</text>
  </g>
</svg>
