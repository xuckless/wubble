<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="t d">
<title id="t">How it works</title><desc id="d">Frames travel from Chromium through a shared GPU texture and a wgpu import into Slint, shown as dots moving along a lane. Below, the model emits effects that the engine and gfx crates carry out.</desc>
<defs><radialGradient id="gb"><stop offset="0" stop-color="#2F5FC4" stop-opacity=".5"/><stop offset="1" stop-color="#2F5FC4" stop-opacity="0"/></radialGradient>
<radialGradient id="gm"><stop offset="0" stop-color="#A84886" stop-opacity=".42"/><stop offset="1" stop-color="#A84886" stop-opacity="0"/></radialGradient>
<radialGradient id="gg"><stop offset="0" stop-color="#237E69" stop-opacity=".4"/><stop offset="1" stop-color="#237E69" stop-opacity="0"/></radialGradient>
<linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CC8FF"/><stop offset=".36" stop-color="#B8A6FF"/><stop offset=".68" stop-color="#FF9ED8"/><stop offset="1" stop-color="#8AF2D0"/></linearGradient>
<linearGradient id="hA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CC8FF"/><stop offset="1" stop-color="#B8A6FF"/></linearGradient>
<linearGradient id="hB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9ED8"/><stop offset="1" stop-color="#B8A6FF"/></linearGradient>
<linearGradient id="hC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8AF2D0"/><stop offset="1" stop-color="#7CC8FF"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="480" height="260" rx="20"/></clipPath></defs>
<style>.d{animation:run 4.8s linear infinite}.d2{animation-delay:-1.6s}.d3{animation-delay:-3.2s}@keyframes run{0%{transform:translateX(0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translateX(440px);opacity:0}}.pu{animation:pu 1.6s linear infinite}
@keyframes pu{0%{transform:scale(1);animation-timing-function:cubic-bezier(.22,1,.36,1)}7.5%{transform:scale(1.06)}12.87%{transform:scale(1.02)}18.19%{transform:scale(0.99)}23.56%{transform:scale(0.99)}28.94%{transform:scale(1)}34.31%{transform:scale(1)}39.62%{transform:scale(1)}45%{transform:scale(1)}50.38%{transform:scale(1)}55.69%{transform:scale(1)}61.06%{transform:scale(1)}66.44%{transform:scale(1)}71.81%{transform:scale(1)}77.12%{transform:scale(1)}82.5%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes pr{0%{opacity:0;animation-timing-function:cubic-bezier(.22,1,.36,1)}7.5%{opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1)}75%{opacity:0}100%{opacity:0}}.pr{animation:pr 1.6s linear infinite}
@media (prefers-reduced-motion: reduce){.d{transform:translateX(96px);opacity:1}.d2{transform:translateX(230px);opacity:1}.d3{transform:translateX(352px);opacity:1}}.h{animation:hop 2.4s linear infinite}.h2{animation-delay:-1.2s}@keyframes hop{0%{transform:translateX(0);opacity:0}8%{opacity:1}42%{opacity:1}50%{transform:translateX(40px);opacity:0}100%{transform:translateX(40px);opacity:0}}@media (prefers-reduced-motion: reduce){.h{opacity:1!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
