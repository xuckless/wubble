" text-anchor="middle">Shared GPU</text><text x="0" y="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#7E8496" text-anchor="middle">texture</text></g></g><path d="M182 108 V122" stroke="#2A2F3B" stroke-width="1.5" stroke-linecap="round"/><g transform="translate(298 78)"><g class="pu" style="animation-delay:1.43s"><rect x="-46" y="-30" width="92" height="60" rx="14" fill="#11131A" stroke="#2A2F3B"/><rect x="-46" y="-30" width="92" height="60" rx="14" fill="url(#spec)"/><rect class="pr" style="animation-delay:1.43s" x="-45.25" y="-29.25" width="90.5" height="58.5" rx="13.5" fill="none" stroke="url(#film)" stroke-width="1.5" opacity="0"/><text x="0" y="-3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">wgpu</text><text x="0" y="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#7E8496" text-anchor="middle">import</text></g></g><path d="M298 108 V122" stroke="#2A2F3B" stroke-width="1.5" stroke-linecap="round"/><g transform="translate(414 78)"><g class="pu" style="animation-delay:1.1s"><rect x="-46" y="-30" width="92" height="60" rx="14" fill="#11131A" stroke="#2A2F3B"/><rect x="-46" y="-30" width="92" height="60" rx="14" fill="url(#spec)"/><rect class="pr" style="animation-delay:1.1s" x="-45.25" y="-29.25" width="90.5" height="58.5" rx="13.5" fill="none" stroke="url(#film)" stroke-width="1.5" opacity="0"/><text x="0" y="-3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">Slint</text><text x="0" y="13" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#7E8496" text-anchor="middle">image</text></g></g><path d="M414 108 V122" stroke="#2A2F3B" stroke-width="1.5" stroke-linecap="round"/><g transform="translate(20 128)"><g class="d"><ellipse rx="7" ry="4.6" fill="url(#film)"/><ellipse cx="-2.6" cy="-1.6" rx="2.4" ry="1.2" fill="#fff" fill-opacity=".8"/></g></g><g transform="translate(20 128)"><g class="d d2"><ellipse rx="7" ry="4.6" fill="url(#film)"/><ellipse cx="-2.6" cy="-1.6" rx="2.4" ry="1.2" fill="#fff" fill-opacity=".8"/></g></g><g transform="translate(20 128)"><g class="d d3"><ellipse rx="7" ry="4.6" fill="url(#film)"/><ellipse cx="-2.6" cy="-1.6" rx="2.4" ry="1.2" fill="#fff" fill-opacity=".8"/></g></g><text x="240" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#A3A9B8" text-anchor="middle">frames stay on the GPU the whole way</text><rect x="20" y="176" width="120" height="40" rx="12" fill="#11131A" stroke="#2A2F3B"/><text x="80" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">model</text><text x="80" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#7E8496" text-anchor="middle">tabs, Spaces, sleep</text><rect x="180" y="176" width="120" height="40" rx="12" fill="#11131A" stroke="#2A2F3B"/><text x="240" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">effects</text><text x="240" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#7E8496" text-anchor="middle">as plain values</text><rect x="340" y="176" width="120" height="40" rx="12" fill="#11131A" stroke="#2A2F3B"/><text x="400" y="193" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">engine + gfx</text><text x="400" y="207" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#7E8496" text-anchor="middle">carry them out</text><path d="M144 196H176" stroke="#2A2F3B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 5"/><path d="M304 196H336" stroke="#2A2F3B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 5"/><g transform="translate(140 196)"><g class="h" opacity="0"><ellipse rx="5" ry="3.4" fill="url(#film)"/></g></g><g transform="translate(300 196)"><g class="h h2" opacity="0"><ellipse rx="5" ry="3.4" fill="url(#film)"/></g></g><text x="240" y="244" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#7E8496" text-anchor="middle">state in, effects out: only the engine and gfx run them</text><rect x=".5" y=".5" width="479" height="259" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/></svg>
