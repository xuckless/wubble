[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored third-party code is not linted by `clippy --workspace`; its own
# rustfmt.toml keeps `cargo fmt --all` off it. Built as a path dependency,
# tested with `cargo test -p welding`; the renderer through wubble-ui's crisp_text test.
exclude = ["vendor/welding"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
wubble-ax = { path = "crates/wubble-ax" }
wubble-blocker = { path = "crates/wubble-blocker" }
wubble-core = { path = "crates/wubble-core" }
wubble-engine = { path = "crates/wubble-engine" }
wubble-gfx = { path = "crates/wubble-gfx" }
wubble-release = { path = "crates/wubble-release" }
wubble-store = { path = "crates/wubble-store" }
wubble-sysmem = { path = "crates/wubble-sysmem" }
wubble-vault = { path = "crates/wubble-vault" }
wubble-ui = { path = "crates/wubble-ui" }

# All three must agree on the wgpu major (currently 30).
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    # Skia on the shared wgpu device (`skia-wgpu`); see TODO.md Decided "Shell renderer".
    "renderer-skia",
    "unstable-wgpu-30",
    # Only for the monitor refresh-rate query (wubble main).
    "unstable-winit-030",
] }
slint-build = "1.19"
wgpu = "30"
# Forked: welding 0.15.0 (MPL-2.0) vendored with wubble's changes, see
# vendor/welding/WUBBLE_CHANGES.md. Its slint/wgpu/cef pins still apply.
welding = { path = "vendor/welding", features = ["cef-runtime"] }
# Pinned with the vendored welding fork (cef 156.6, its change 7); only one cef-dll-sys may be linked. Bump together.
cef = "156.6"
# welding's size type (`PhysicalSize`); not re-exported by welding. Same version welding and winit use.
dpi = "0.1.2"
serde_json = "1"
url = "2"
clap = { version = "4.6", features = ["derive"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Daily release builds: thin LTO, one codegen unit (TODO.md Decided "Release profile").
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# What ships: fat LTO and no symbol table: wubble 64 MB against release's 78 MB (67 MB stripped
# alone), the same frame cost and start-up as `release` within the noise, and a rebuild after a
# change in `wubble` about 2.3 times as slow (241 s against 104 s on the Linux box), so it is
# not the daily profile. `cargo build --profile dist`; the binaries land in target/dist.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
