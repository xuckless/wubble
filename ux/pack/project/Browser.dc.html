<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wubble browser window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC8FF}a:hover{color:#B8E2FF}
.wb button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.wb :focus-visible{outline:2px solid #7CC8FF;outline-offset:2px}
.spec::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 40%)}
.film::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from 210deg,#7CC8FF,#B8A6FF,#FF9ED8,#8AF2D0,#7CC8FF);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s ease-out}
.film:hover::before,.film:focus-visible::before,.film.on::before{opacity:.75}
.ib{position:relative;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#A3A9B8;cursor:pointer;transition:color .15s,background .15s,transform .2s cubic-bezier(.22,1,.36,1)}
.ib:hover{background:rgba(255,255,255,.07);color:#F2F4FA}
.ib:active{transform:scale(.97)}
.ib.hitA svg{animation:wobA .55s ease-out}.ib.hitB svg{animation:wobB .55s ease-out}
.wc{width:12px;height:12px;border-radius:6px;border:0;padding:0;background:rgba(255,255,255,.2);cursor:pointer;transition:background .2s,transform .3s cubic-bezier(.3,1.55,.5,1)}
.wcs:hover .wc:nth-child(1){background:#FF8F7F}.wcs:hover .wc:nth-child(2){background:#FFD98A}.wcs:hover .wc:nth-child(3){background:#8AF2D0}
.wc:active{transform:scale(.8,1.15)}
.url{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.05);cursor:text;text-align:left;transition:transform .2s cubic-bezier(.22,1,.36,1),background .15s}
.url:hover{background:rgba(255,255,255,.1)}
.url:active{transform:scale(.97)}
.fav{position:relative;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);color:#DADDE6;cursor:pointer;transition:background .15s,transform .2s cubic-bezier(.22,1,.36,1)}
.fav:hover{background:rgba(255,255,255,.11)}
.fav:active{transform:scale(.94,.9)}
.fav.hitA svg{animation:wobA .55s ease-out}.fav.hitB svg{animation:wobB .55s ease-out}
.tab{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:#C3C8D4;font-size:13.5px;text-align:left;cursor:pointer;transition:color .15s,background .15s,transform .2s cubic-bezier(.22,1,.36,1)}
.tab:hover{background:rgba(255,255,255,.05)}
.tab.active{color:#F2F4FA;background:transparent}
.tab:active{transform:scale(.97)}
.tab .gl{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#0B0C12;flex:none}
.tab.hitA .gl{animation:wobA .55s ease-out}.tab.hitB .gl{animation:wobB .55s ease-out}
.tab .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .cx{opacity:0;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#A3A9B8;transition:opacity .15s}
.tab:hover .cx{opacity:1}
.in-a .tab{animation:ovA .24s cubic-bezier(.22,1,.36,1) backwards}.in-b .tab{animation:ovB .24s cubic-bezier(.22,1,.36,1) backwards}
.ind{position:absolute;left:0;right:0;height:36px;border-radius:10px;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.06),0 6px 14px rgba(0,0,0,.28);pointer-events:none}
.sp{position:relative;width:22px;height:22px;border:0;padding:0;border-radius:11px;cursor:pointer;transition:transform .45s cubic-bezier(.3,1.55,.5,1),opacity .2s;opacity:.45}
.sp:hover{opacity:.8}
.sp.on{opacity:1;transform:scale(1.18)}
.sp:active{transform:scale(1.25,.85)}
.seam-svg{position:absolute;left:8px;top:8px;width:1304px;height:796px;pointer-events:none;overflow:visible;z-index:2}
.seam-svg path{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.25;transition:stroke .2s}
.bwin.held .seam-svg path{stroke:url(#seamFilmB);stroke-width:1.6}
.bwin.closed .seam-svg path{stroke:transparent}
.pill{position:absolute;left:0;top:0;width:6px;height:40px;pointer-events:none;z-index:3}
.pill i{display:block;width:100%;height:100%;border-radius:3px;background:#A3A9B8;opacity:0;scale:.5;transition:opacity .16s ease-in,scale .16s ease-in,background .15s}
.bwin:has(.grab:hover) .pill i{opacity:.8;scale:.75;transition:opacity .2s ease-out,scale .25s cubic-bezier(.3,1.55,.5,1)}
.bwin.held .pill i,.bwin:has(.grab:focus-visible) .pill i{opacity:1;scale:1;background:#7CC8FF;transition:opacity .15s ease-out,scale .3s cubic-bezier(.3,1.55,.5,1)}
.grab{position:absolute;top:0;bottom:0;left:-10px;width:20px;border:0;padding:0;background:transparent;cursor:col-resize;touch-action:none;outline:none;z-index:4}
.reopen{position:absolute;top:18px;z-index:4;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:11px;color:#DADDE6;cursor:pointer;background:rgba(255,255,255,.08);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.06);animation:ovA .24s cubic-bezier(.22,1,.36,1) backwards;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.reopen:active{transform:scale(.97)}
.qb{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:0;cursor:pointer;color:#A3A9B8;font-size:12px}
.qb b{position:relative;width:60px;height:60px;border-radius:30px;display:grid;place-items:center;background:rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.35);color:#F2F4FA;transition:transform .45s cubic-bezier(.3,1.55,.5,1)}
.qb:hover b{transform:scale(1.08)}
.qb:active b{transform:scale(1.12,.86);transition-duration:.12s}
.qb:hover{color:#F2F4FA}
.search{position:relative;display:flex;align-items:center;gap:12px;width:520px;height:54px;padding:0 20px;border:0;border-radius:27px;background:rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.06),0 14px 30px rgba(0,0,0,.4);color:#A3A9B8;font-size:15px;cursor:text;text-align:left;transition:transform .45s cubic-bezier(.3,1.55,.5,1)}
.search:hover{transform:scale(1.015)}
.search:active{transform:scale(.97,.94);transition-duration:.12s}
.cmd{z-index:6;animation:cmdIn .42s cubic-bezier(.3,1.35,.5,1) both}
.cmd .row{animation:ovA .24s cubic-bezier(.22,1,.36,1) backwards}
.row{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#DADDE6;font-size:14px;text-align:left;cursor:pointer;transition:background .12s}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.08)}
.cmdin{flex:1;min-width:0;height:52px;border:0;background:transparent;color:#F2F4FA;font:inherit;font-size:17px;outline:none}
.cmdin::placeholder{color:#7E8496}
.scrim{z-index:5;animation:fadeIn .2s ease-out both}
@keyframes wobA{0%{transform:none}25%{transform:rotate(-14deg) scale(.9,1.12)}50%{transform:rotate(9deg) scale(1.06,.95)}75%{transform:rotate(-4deg)}100%{transform:none}}
@keyframes wobB{0%{transform:none}25%{transform:rotate(-14deg) scale(.9,1.12)}50%{transform:rotate(9deg) scale(1.06,.95)}75%{transform:rotate(-4deg)}100%{transform:none}}
@keyframes ovA{from{opacity:0;filter:blur(4px);transform:translateY(7px) scale(.98)}to{opacity:1;filter:none;transform:none}}
@keyframes ovB{from{opacity:0;filter:blur(4px);transform:translateY(7px) scale(.98)}to{opacity:1;filter:none;transform:none}}
@keyframes cmdIn{from{opacity:0;filter:blur(6px);transform:translateY(-10px) scale(.94,.9)}60%{opacity:1;filter:none}to{opacity:1;filter:none;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wb *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="wb" style="position: relative; width: 1440px; height: 920px; overflow: hidden; background: #07080C; color: #F2F4FA; font-family: Geist, system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: -60px; top: 80px; width: 520px; height: 520px; border-radius: 50%; background: #2F5FC4; filter: blur(30px); opacity: .7"></div>
<div aria-hidden="true" style="position: absolute; left: 220px; top: 520px; width: 380px; height: 380px; border-radius: 50%; background: #A84886; filter: blur(30px); opacity: .6"></div>
<div aria-hidden="true" style="position: absolute; left: 1080px; top: -80px; width: 420px; height: 420px; border-radius: 50%; background: #237E69; filter: blur(30px); opacity: .55"></div>
<div aria-hidden="true" style="position: absolute; left: 140px; top: 30px; width: 120px; height: 120px; border-radius: 50%; background: #7563D8; opacity: .8"></div>

<div class="bwin {{winCls}}" style="position: absolute; left: 60px; top: 40px; width: 1320px; height: 812px; border-radius: 22px; background: rgba(16,18,25,.46); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(255,255,255,.07), 0 40px 90px rgba(0,0,0,.55); overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{tint}}; opacity: .11; transition: background .5s cubic-bezier(.65,0,.35,1); pointer-events: none"></div>

<aside aria-label="Sidebar" aria-hidden="{{sideHidden}}" style="position: absolute; left: 8px; top: 8px; bottom: 8px; width: {{sw}}px; opacity: {{so}}; pointer-events: {{spe}}; display: flex; flex-direction: column; gap: 12px; padding: 6px 4px 6px 6px; box-sizing: border-box; min-width: 0">
<div style="display: flex; align-items: center; justify-content: space-between; height: 30px; translate: {{o.ctrl}}px 0">
<div class="wcs" style="display: flex; gap: 8px; padding-left: 4px">
<button class="wc" aria-label="Close window"></button>
<button class="wc" aria-label="Minimise window"></button>
<button class="wc" aria-label="Full screen"></button>
</div>
<div style="display: flex; gap: 2px">
<button class="ib" aria-label="Hide sidebar" aria-expanded="true" onClick="{{toggleSide}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3zM9 4v16"></path></svg></button>
<button class="ib {{hitBack}}" aria-label="Back" onClick="{{back}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button class="ib {{hitFwd}}" aria-label="Forward" onClick="{{fwd}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<button class="ib {{hitReload}}" aria-label="Reload" onClick="{{reload}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.5H15"></path></svg></button>
</div>
</div>

<button class="url film" aria-label="Address bar, wubble.app/start" onClick="{{openCmd}}" style="translate: {{o.url}}px 0">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8AF2D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #F2F4FA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">wubble.app<span style="color: #7E8496">/start</span></span>
</button>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; translate: {{o.fav}}px 0">
<button class="fav film {{hitF0}}" aria-label="Mail" onClick="{{f0}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg></button>
<button class="fav film {{hitF1}}" aria-label="Calendar" onClick="{{f1}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg></button>
<button class="fav film {{hitF2}}" aria-label="Music" onClick="{{f2}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"></path></svg></button>
<button class="fav film {{hitF3}}" aria-label="Notes" onClick="{{f3}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h5"></path></svg></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; height: 18px; padding: 4px 6px 0 10px; translate: {{o.hdr}}px 0">
<span style="font-size: 12px; font-weight: 500; color: #A3A9B8">{{spaceName}}</span>
<span style="font-size: 12px; color: #7E8496">Today</span>
</div>

<div style="position: relative; display: flex; flex-direction: column; gap: 4px">
<div class="ind" aria-hidden="true" style="top: {{iy}}px; transform: scale({{isx}}, {{isy}}); transform-origin: {{iorigin}}; translate: {{o.ind}}px 0"></div>
<div class="{{listCls}}" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<button class="{{tab.cls}}" style="animation-delay: {{tab.delay}}ms; translate: {{tab.off}}px 0" onClick="{{tab.pick}}" aria-current="{{tab.current}}">
<span class="gl" style="background: {{tab.color}}">{{tab.glyph}}</span>
<span class="tt">{{tab.title}}</span>
<span class="cx" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
</button>
</sc-for>
</div>
</div>
<button class="tab" onClick="{{openCmd}}" style="color: #A3A9B8; translate: {{o.newtab}}px 0">
<span class="gl" style="background: rgba(255,255,255,.08); color: #A3A9B8"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span class="tt">New tab</span>
</button>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 2px 8px; translate: {{o.bottom}}px 0">
<div style="display: flex; align-items: center; gap: 12px">
<sc-for list="{{spaces}}" as="sp" hint-placeholder-count="3">
<button class="{{sp.cls}}" style="background: {{sp.tint}}" aria-label="{{sp.label}}" aria-pressed="{{sp.on}}" onClick="{{sp.pick}}"></button>
</sc-for>
<button class="ib" aria-label="New Space" style="width: 24px; height: 24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<button class="ib" aria-label="Downloads"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"></path></svg></button>
</div>
</aside>

<main style="position: absolute; left: 8px; top: 8px; width: 1304px; height: 796px; clip-path: path('{{clip}}'); -webkit-clip-path: path('{{clip}}'); background: #0E1016">
<div style="position: absolute; top: 0; bottom: 0; left: {{pa}}px; right: 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 50%; top: 120px; width: 360px; height: 360px; margin-left: -380px; border-radius: 50%; background: #2B4FA0; filter: blur(60px); opacity: .45"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 300px; width: 300px; height: 300px; margin-left: 60px; border-radius: 50%; background: #8E3C74; filter: blur(60px); opacity: .4"></div>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding-bottom: 40px">
<svg width="72" height="72" viewBox="0 0 120 120" role="img" aria-label="Wubble">
<defs>
<linearGradient id="filmB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CC8FF"></stop><stop offset=".36" stop-color="#B8A6FF"></stop><stop offset=".68" stop-color="#FF9ED8"></stop><stop offset="1" stop-color="#8AF2D0"></stop></linearGradient>
<radialGradient id="bodyB" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#262B3B"></stop><stop offset=".66" stop-color="#12141C"></stop><stop offset="1" stop-color="#0B0C12"></stop></radialGradient>
</defs>
<path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="url(#bodyB)" stroke="url(#filmB)" stroke-width="3.2"></path>
<path d="M32 48Q38 82 46 82Q53 82 60 60Q67 82 74 82Q82 82 88 48" fill="none" stroke="url(#filmB)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
<ellipse cx="36" cy="30" rx="11" ry="5.2" transform="rotate(-35 36 30)" fill="#FFFFFF" opacity=".85"></ellipse>
</svg>
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 44px; line-height: 1">Where to next?</h1>
<button class="search film" onClick="{{openCmd}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<span style="flex: 1">Search or type an address</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7E8496">Ctrl T</span>
</button>
<div style="display: flex; gap: 28px; margin-top: 6px">
<button class="qb"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg></b>Mail</button>
<button class="qb"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg></b>Calendar</button>
<button class="qb"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h5"></path></svg></b>Notes</button>
<button class="qb"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg></b>Maps</button>
<button class="qb"><b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"></path></svg></b>Music</button>
</div>
</div>
</div>
</main>

<svg class="seam-svg" viewBox="0 0 1304 796" preserveAspectRatio="none" aria-hidden="true">
<defs><linearGradient id="seamFilmB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="796"><stop offset="0" stop-color="#7CC8FF"></stop><stop offset=".36" stop-color="#B8A6FF"></stop><stop offset=".68" stop-color="#FF9ED8"></stop><stop offset="1" stop-color="#8AF2D0"></stop></linearGradient></defs>
<path d="{{seamPath}}"></path>
</svg>
<span class="pill" aria-hidden="true" style="transform: translate({{gapX}}px, {{gy}}px) translate(-50%, -50%)"><i></i></span>
<sc-if value="{{sideOpen}}" hint-placeholder-val="{{true}}">
<button class="grab" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="{{minW}}" aria-valuemax="{{maxW}}" aria-valuenow="{{nowW}}" style="transform: translateX({{gapX}}px)" onPointerDown="{{gDown}}" onPointerMove="{{gMove}}" onPointerUp="{{gUp}}" onPointerCancel="{{gUp}}" onKeyDown="{{gKey}}"></button>
</sc-if>
<sc-if value="{{sideClosed}}" hint-placeholder-val="{{false}}">
<button class="reopen" aria-label="Show sidebar" aria-expanded="false" style="left: {{reopenX}}px" onClick="{{toggleSide}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3zM9 4v16"></path></svg></button>
</sc-if>

<sc-if value="{{cmdOpen}}" hint-placeholder-val="{{false}}">
<div class="scrim" style="position: absolute; inset: 0; background: rgba(5,6,9,.35)" onClick="{{closeCmd}}"></div>
<div class="cmd film on" role="dialog" aria-label="Command bar" onKeyDown="{{cmdKey}}" style="position: absolute; left: 50%; top: 96px; width: 600px; margin-left: -300px; padding: 6px 8px 10px; box-sizing: border-box; border-radius: 20px; background: rgba(28,31,40,.66); backdrop-filter: blur(44px) saturate(200%); -webkit-backdrop-filter: blur(44px) saturate(200%); box-shadow: inset 0 1px 0 rgba(255,255,255,.24), inset 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.55)">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A9B8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<input class="cmdin" aria-label="Search or type an address" placeholder="Search or type an address" autoFocus="{{true}}">
<button class="ib" aria-label="Close command bar" onClick="{{closeCmd}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<button class="row" style="animation-delay: 60ms" onClick="{{closeCmd}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7CC8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg><span style="flex: 1">Switch to Inbox</span><span style="font-size: 12px; color: #7E8496">Open tab</span></button>
<button class="row" style="animation-delay: 90ms" onClick="{{closeCmd}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8A6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg><span style="flex: 1">slint.dev/docs</span><span style="font-size: 12px; color: #7E8496">History</span></button>
<button class="row" style="animation-delay: 120ms" onClick="{{closeCmd}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF9ED8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg><span style="flex: 1">New Space</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7E8496">Ctrl Shift N</span></button>
<button class="row" style="animation-delay: 150ms" onClick="{{closeCmd}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8AF2D0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM14 6v12"></path></svg><span style="flex: 1">Split view with this tab</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7E8496">Ctrl Shift =</span></button>
</div>
</sc-if>
</div>

<p style="position: absolute; left: 60px; right: 60px; top: 868px; margin: 0; display: flex; justify-content: space-between; font-size: 13px; color: #A3A9B8">
<span>Grab the seam anywhere and pull: it bends like a rubber string and the sidebar rides the curve. Hide it from the panel button.</span>
<span>Sidebar and toolbar: Regular glass. Command bar: Thick glass with the film rim.</span>
</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
var SPACES = [
  { name: 'Personal', tint: '#7CC8FF', tabs: [['Start page', 'W', '#7CC8FF'], ['Inbox', 'I', '#FF9ED8'], ['Weekend plans', 'P', '#8AF2D0'], ['Miso soup, three ways', 'M', '#FFD98A'], ['Spring physics notes', 'S', '#B8A6FF']] },
  { name: 'Work', tint: '#B8A6FF', tabs: [['Sprint board', 'B', '#B8A6FF'], ['Design review', 'D', '#FF9ED8'], ['Slint docs', 'S', '#7CC8FF'], ['Release notes draft', 'R', '#8AF2D0']] },
  { name: 'Study', tint: '#8AF2D0', tabs: [['Parallel computing notes', 'P', '#8AF2D0'], ['Lecture 9 slides', 'L', '#7CC8FF'], ['Library search', 'Q', '#FFD98A']] }
];
var PITCH = 40, MINW = 200, MAXW = 340, WW = 1320, WH = 812, LW = 1304, LH = 796, RAD = 14;
var Y_CTRL = 29, Y_URL = 74, Y_FAV = 126, Y_HDR = 171, Y_LIST = 194, Y_BOTTOM = 783;
function band(d, k) { return Math.sign(d) * k * (1 - 1 / (Math.abs(d) / k + 1)); }
function bandClamp(v, a, b, k) { return v < a ? a + band(v - a, k) : v > b ? b + band(v - b, k) : v; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function springStep(s, target, k, c, dt) {
  var a = -k * (s.x - target) - c * s.v;
  s.v += a * dt; s.x += s.v * dt;
  if (Math.abs(s.v) < 0.02 && Math.abs(s.x - target) < 0.02) { s.x = target; s.v = 0; return false; }
  return true;
}
function reduced() { return typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function f(n) { return n.toFixed(2); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var saved = 252;
    this.state = { space: 0, active: [0, 0, 0], open: true, held: false, now: saved, cmd: false, swapped: false, swapPar: false, hits: {}, frame: 0 };
    this.s = {
      y: { x: 0, v: 0 }, ty: 0, st: { x: 1, v: 0 }, vel: 0, dir: 1,
      w: { x: saved, v: 0 }, target: saved, saved: saved, d: { x: 0, v: 0 }, cw: { x: saved, v: 0 }, gy: WH / 2, held: false, px: 0, py: 0,
      raf: 0, last: 0
    };
    var self = this, s = this.s;
    this.tick = function (now) {
      var dt = Math.min(0.032, (now - s.last) / 1000); s.last = now;
      var moving = false;
      /* tab indicator: follow + stretch springs */
      var before = s.y.x;
      moving = springStep(s.y, s.ty, 300, 15, dt) || moving;
      var inst = (s.y.x - before) / Math.max(dt, 1e-3);
      s.vel = s.vel * 0.6 + inst * 0.4;
      if (Math.abs(s.vel) > 30) s.dir = Math.sign(s.vel);
      moving = springStep(s.st, 1 + Math.min(0.55, Math.abs(s.vel) / 1500), 700, 24, dt) || moving;
      /* seam: Room to play physics, mirrored for a left sidebar */
      if (s.held) {
        var want = bandClamp(s.px - 8, MINW, MAXW, 34);
        springStep(s.w, want, 150, 20, dt);
        s.d.x = band(s.px - (8 + s.w.x + 4), 70); s.d.v = 0;
        s.gy += (clamp(s.py, 18, WH - 18) - s.gy) * Math.min(1, dt * 30);
        moving = true;
      } else {
        var a = springStep(s.w, s.target, 260, 24, dt);
        var b = springStep(s.d, 0, 520, 9, dt);
        moving = a || b || moving;
      }
      /* follow-through: sidebar contents settle a beat after the seam */
      var c = springStep(s.cw, s.w.x, 210, 21, dt);
      s.cw.x = clamp(s.cw.x, s.w.x - 40, s.w.x + 8);
      moving = c || moving;
      self.setState({ frame: self.state.frame + 1 });
      s.raf = moving ? requestAnimationFrame(self.tick) : 0;
    };
    this.kick = function () { if (s.raf) return; s.last = performance.now(); s.raf = requestAnimationFrame(self.tick); };
    this.hit = function (key) {
      var h = Object.assign({}, self.state.hits);
      h[key] = h[key] === 'hitA' ? 'hitB' : 'hitA';
      self.setState({ hits: h });
    };
    this.pickTab = function (i) {
      var act = self.state.active.slice(); act[self.state.space] = i;
      self.setState({ active: act });
      self.hit('t' + self.state.space + '-' + i);
      s.ty = i * PITCH;
      if (reduced()) { s.y.x = s.ty; s.y.v = 0; }
      self.kick();
    };
    this.pickSpace = function (i) {
      if (i === self.state.space) return;
      self.setState({ space: i, swapped: true, swapPar: !self.state.swapPar });
      s.ty = self.state.active[i] * PITCH;
      self.kick();
    };
    this.local = function (e) {
      var win = e.currentTarget.closest('.bwin'), r = win.getBoundingClientRect();
      s.px = (e.clientX - r.left) * (WW / (r.width || WW));
      s.py = (e.clientY - r.top) * (WH / (r.height || WH));
    };
    this.gDown = function (e) {
      e.currentTarget.setPointerCapture(e.pointerId); self.local(e);
      s.gy = clamp(s.py, 18, WH - 18); s.held = true; self.setState({ held: true }); self.kick();
    };
    this.gMove = function (e) { if (s.held) self.local(e); };
    this.gUp = function () {
      if (!s.held) return;
      s.held = false; s.saved = s.target = clamp(s.w.x, MINW, MAXW);
      self.setState({ held: false, now: Math.round(s.saved) }); self.kick();
    };
    this.gKey = function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      var dir = e.key === 'ArrowRight' ? 1 : -1;
      s.saved = s.target = clamp(s.saved + dir * 16, MINW, MAXW);
      s.gy = WH / 2; s.d.v += dir * 220; self.setState({ now: s.saved }); self.kick();
    };
    this.toggleSide = function () {
      var o = !self.state.open;
      s.target = o ? s.saved : 0; s.d.v += o ? 260 : -260;
      self.setState({ open: o }); self.kick();
    };
    this.openCmd = function () { self.setState({ cmd: true }); };
    this.closeCmd = function () { self.setState({ cmd: false }); };
    this.cmdKey = function (e) { if (e.key === 'Escape') { e.stopPropagation(); self.setState({ cmd: false }); } };
  }
  componentWillUnmount() { if (this.s.raf) cancelAnimationFrame(this.s.raf); }
  renderVals() {
    var st = this.state, s = this.s, self = this, sp = SPACES[st.space], act = st.active[st.space], h = st.hits;
    /* seam geometry, webview-local coordinates */
    var a = s.w.x + 8, bb = a + s.d.x, g = clamp(s.gy - 8, RAD + 4, LH - RAD - 4), R = RAD, top = R, bot = LH - R;
    var lower = 'C' + f(a) + ' ' + f(g + (bot - g) * 0.5) + ' ' + f(bb) + ' ' + f(g + (bot - g) * 0.55) + ' ' + f(bb) + ' ' + f(g);
    var upper = 'C' + f(bb) + ' ' + f(top + (g - top) * 0.45) + ' ' + f(a) + ' ' + f(top + (g - top) * 0.5) + ' ' + f(a) + ' ' + f(top);
    var clip = 'M' + f(a + R) + ' 0 L' + (LW - R) + ' 0 Q' + LW + ' 0 ' + LW + ' ' + R + ' L' + LW + ' ' + (LH - R) + ' Q' + LW + ' ' + LH + ' ' + (LW - R) + ' ' + LH +
      ' L' + f(a + R) + ' ' + LH + ' Q' + f(a) + ' ' + LH + ' ' + f(a) + ' ' + f(bot) + ' ' + lower + ' ' + upper + ' Q' + f(a) + ' 0 ' + f(a + R) + ' 0 Z';
    var seamPath = 'M' + f(a) + ' ' + f(bot) + ' ' + lower + ' ' + upper;
    /* rows ride the curve: the one nearest the grab point is pushed furthest */
    var d = s.d.x, gyW = s.gy;
    var ride = function (y) {
      var u = clamp(y < gyW ? y / gyW : (WH - y) / (WH - gyW), 0, 1);
      return d * u * u * (3 - 2 * u);
    };
    var n = sp.tabs.length;
    var tabs = sp.tabs.map(function (t, i) {
      var hk = h['t' + st.space + '-' + i];
      return { title: t[0], glyph: t[1], color: t[2], delay: i * 30, current: i === act ? 'page' : 'false',
        cls: 'tab' + (i === act ? ' active' : '') + (hk ? ' ' + hk : ''), off: f(ride(Y_LIST + i * PITCH + 18)),
        pick: function () { self.pickTab(i); } };
    });
    var spaces = SPACES.map(function (x, i) {
      return { tint: x.tint, label: x.name + ' Space', on: i === st.space ? 'true' : 'false', cls: 'sp' + (i === st.space ? ' on' : ''), pick: function () { self.pickSpace(i); } };
    });
    var o = {
      ctrl: f(ride(Y_CTRL)), url: f(ride(Y_URL)), fav: f(ride(Y_FAV)), hdr: f(ride(Y_HDR)),
      ind: f(ride(Y_LIST + s.y.x + 18)), newtab: f(ride(Y_LIST + n * PITCH + 8 + 18)), bottom: f(ride(Y_BOTTOM))
    };
    var sx = s.st.x;
    return {
      tint: sp.tint, spaceName: sp.name, tabs: tabs, spaces: spaces, o: o,
      listCls: st.swapped ? (st.swapPar ? 'in-a' : 'in-b') : '',
      iy: f(s.y.x), isx: (1 / Math.sqrt(sx)).toFixed(4), isy: sx.toFixed(4), iorigin: s.dir > 0 ? '50% 70%' : '50% 30%',
      winCls: (st.held ? 'held' : '') + (st.open ? '' : ' closed'),
      sw: f(Math.max(s.cw.x, MINW)), so: Math.pow(clamp(s.w.x / MINW, 0, 1), 2).toFixed(3), spe: st.open ? 'auto' : 'none', sideHidden: st.open ? 'false' : 'true',
      clip: clip, seamPath: seamPath, pa: f(a), gapX: f(8 + s.w.x + 4 + s.d.x), gy: f(s.gy),
      sideOpen: st.open, sideClosed: !st.open, reopenX: f(8 + a + 14), toggleSide: this.toggleSide,
      minW: MINW, maxW: MAXW, nowW: st.now, gDown: this.gDown, gMove: this.gMove, gUp: this.gUp, gKey: this.gKey,
      cmdOpen: st.cmd, openCmd: this.openCmd, closeCmd: this.closeCmd, cmdKey: this.cmdKey,
      hitBack: h.back || '', hitFwd: h.fwd || '', hitReload: h.reload || '',
      back: function () { self.hit('back'); }, fwd: function () { self.hit('fwd'); }, reload: function () { self.hit('reload'); },
      hitF0: h.f0 || '', hitF1: h.f1 || '', hitF2: h.f2 || '', hitF3: h.f3 || '',
      f0: function () { self.hit('f0'); }, f1: function () { self.hit('f1'); }, f2: function () { self.hit('f2'); }, f3: function () { self.hit('f3'); }
    };
  }
}
</script>
