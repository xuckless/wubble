<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wubble app icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC8FF}a:hover{color:#B8E2FF}
.ic{transition:transform .45s cubic-bezier(.3,1.55,.5,1)}
.ic:hover{transform:scale(1.06)}
</style>
</helmet>
<div style="width: 1440px; height: 720px; box-sizing: border-box; padding: 64px 72px; background: #08090D; color: #F2F4FA; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<linearGradient id="fi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CC8FF"></stop><stop offset=".36" stop-color="#B8A6FF"></stop><stop offset=".68" stop-color="#FF9ED8"></stop><stop offset="1" stop-color="#8AF2D0"></stop></linearGradient>
<radialGradient id="bd" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#262B3B"></stop><stop offset=".66" stop-color="#12141C"></stop><stop offset="1" stop-color="#0B0C12"></stop></radialGradient>
<radialGradient id="plate" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#20263A"></stop><stop offset=".6" stop-color="#0F1118"></stop><stop offset="1" stop-color="#08090D"></stop></radialGradient>
<radialGradient id="plateL" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#DCE1EC"></stop></radialGradient>
<symbol id="mk" viewBox="0 0 120 120">
<path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="url(#bd)"></path>
<path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="none" stroke="url(#fi)" stroke-width="3.2"></path>
<path d="M32 48Q38 82 46 82Q53 82 60 60Q67 82 74 82Q82 82 88 48" fill="none" stroke="url(#fi)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
<ellipse cx="36" cy="30" rx="11" ry="5.2" transform="rotate(-35 36 30)" fill="#FFFFFF" opacity=".85"></ellipse>
<circle cx="51" cy="21" r="2.6" fill="#FFFFFF" opacity=".7"></circle>
</symbol>
<symbol id="mono" viewBox="0 0 120 120">
<path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="none" stroke="currentColor" stroke-width="6"></path>
<path d="M32 48Q38 82 46 82Q53 82 60 60Q67 82 74 82Q82 82 88 48" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>
<ellipse cx="36" cy="30" rx="10" ry="4.6" transform="rotate(-35 36 30)" fill="currentColor"></ellipse>
</symbol>
</defs>
</svg>

<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 56px; line-height: 1">App icons</h1>
<p style="margin: 0; font-size: 14px; color: #A3A9B8; max-width: 36em; text-align: right">The same dark-glass bubble everywhere. Only the plate changes to meet each store's mask.</p>
</header>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px">
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="height: 190px; display: grid; place-items: center">
<div class="ic" style="position: relative; width: 168px; height: 168px; border-radius: 37.6px; background: radial-gradient(120% 120% at 30% 18%, #222840, #0E1017 62%, #08090D); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.07), 0 16px 34px rgba(0,0,0,.6); display: grid; place-items: center">
<svg width="128" height="128" aria-hidden="true"><use href="#mk"></use></svg>
</div>
</div>
<figcaption style="text-align: center"><b style="display: block; font-size: 15px; font-weight: 600">macOS</b><span style="font-size: 13px; color: #A3A9B8">Squircle plate, 1024 grid, 10% margin</span></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="height: 190px; display: flex; align-items: center; gap: 14px">
<div class="ic" style="width: 120px; height: 120px; border-radius: 27px; background: radial-gradient(120% 120% at 30% 18%, #222840, #0E1017 62%, #08090D); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); display: grid; place-items: center"><svg width="96" height="96" aria-hidden="true"><use href="#mk"></use></svg></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="ic" style="width: 54px; height: 54px; border-radius: 12px; background: radial-gradient(120% 120% at 30% 18%, #FFFFFF, #DCE1EC); display: grid; place-items: center"><svg width="44" height="44" viewBox="0 0 120 120" aria-hidden="true"><path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="#FFFFFF" stroke="url(#fi)" stroke-width="4"></path><path d="M32 48Q38 82 46 82Q53 82 60 60Q67 82 74 82Q82 82 88 48" fill="none" stroke="url(#fi)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<div class="ic" style="width: 54px; height: 54px; border-radius: 12px; background: #1B1D22; color: #C9D6FF; display: grid; place-items: center"><svg width="40" height="40" aria-hidden="true"><use href="#mono"></use></svg></div>
</div>
</div>
<figcaption style="text-align: center"><b style="display: block; font-size: 15px; font-weight: 600">iOS and iPadOS</b><span style="font-size: 13px; color: #A3A9B8">Dark default, light and tinted layers</span></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="height: 190px; display: flex; align-items: center; gap: 14px">
<div class="ic" style="width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(120% 120% at 30% 18%, #222840, #0E1017 62%, #08090D); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 24px rgba(0,0,0,.5); display: grid; place-items: center"><svg width="92" height="92" aria-hidden="true"><use href="#mk"></use></svg></div>
<div class="ic" style="width: 58px; height: 58px; border-radius: 50%; background: #D6E2FF; color: #1D2A4D; display: grid; place-items: center"><svg width="38" height="38" aria-hidden="true"><use href="#mono"></use></svg></div>
</div>
<figcaption style="text-align: center"><b style="display: block; font-size: 15px; font-weight: 600">Android</b><span style="font-size: 13px; color: #A3A9B8">Adaptive 108 dp, mark in the 66 dp safe zone; themed mono</span></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="height: 190px; display: flex; align-items: center; gap: 14px">
<div style="width: 150px; height: 150px; border-radius: 16px; background: linear-gradient(160deg, #1D2130, #13151C); display: grid; place-items: center">
<svg class="ic" width="112" height="112" aria-hidden="true" style="filter: drop-shadow(0 8px 14px rgba(0,0,0,.55))"><use href="#mk"></use></svg>
</div>
<div style="width: 58px; height: 150px; border-radius: 16px; background: #EEF1F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<svg width="32" height="32" aria-hidden="true"><use href="#mk"></use></svg>
<svg width="24" height="24" aria-hidden="true"><use href="#mk"></use></svg>
</div>
</div>
<figcaption style="text-align: center"><b style="display: block; font-size: 15px; font-weight: 600">Windows</b><span style="font-size: 13px; color: #A3A9B8">No plate: the bubble is the shape, on dark and light taskbars</span></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="height: 190px; display: grid; place-items: center">
<div class="ic" style="width: 150px; height: 150px; border-radius: 34px; background: radial-gradient(120% 120% at 30% 18%, #222840, #0E1017 62%, #08090D); box-shadow: inset 0 -6px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2), 0 12px 24px rgba(0,0,0,.5); display: grid; place-items: center"><svg width="112" height="112" aria-hidden="true"><use href="#mk"></use></svg></div>
</div>
<figcaption style="text-align: center"><b style="display: block; font-size: 15px; font-weight: 600">Linux</b><span style="font-size: 13px; color: #A3A9B8">Rounded plate with a base edge, SVG plus symbolic mono</span></figcaption>
</figure>
</div>

<div style="display: flex; align-items: center; gap: 28px; padding: 22px 28px; border-radius: 22px; background: #11131A">
<span style="font-size: 13px; color: #A3A9B8; width: 150px">Small sizes</span>
<div style="display: flex; align-items: flex-end; gap: 26px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="64" height="64" aria-hidden="true"><use href="#mk"></use></svg><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A3A9B8">64</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="url(#bd)" stroke="url(#fi)" stroke-width="6"></path><path d="M30 46Q37 84 46 84Q53 84 60 62Q67 84 74 84Q83 84 90 46" fill="none" stroke="url(#fi)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A3A9B8">32</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 120 120" aria-hidden="true"><path d="M61 9C89 8 112 30 111 59C110 90 90 112 60 111C29 110 9 92 9 61C9 31 32 10 61 9Z" fill="#1A1E2A"></path><path d="M28 44Q36 88 46 88Q53 88 60 64Q67 88 74 88Q84 88 92 44" fill="none" stroke="#B8C8FF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A3A9B8">16</span></div>
</div>
<span style="margin-left: auto; font-size: 13px; color: #A3A9B8; max-width: 34em">Under 48 px the highlight dot goes, the W thickens; at 16 px the sheen flattens to one periwinkle so it stays crisp in a tab strip.</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
