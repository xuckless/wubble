name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch or PR supersedes the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where the cef-dll-sys build script keeps the prebuilt CEF archive. The path
  # does not exist on a cold cache, so the script downloads into
  # $CEF_PATH/<version>; the cache step below restores it so warm runs skip the
  # download. Without CEF_PATH it unpacks into the crate's OUT_DIR instead.
  CEF_PATH: ${{ github.workspace }}/.cef-cache

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A cold build compiles CEF's wrapper and Slint; a hung step must not hold
    # a runner for the 6 hour default.
    timeout-minutes: 60
    # Windows is built on CI only and may trail the other platforms: its
    # failures do not fail the run until it has had a first green run (see
    # the "Windows CI" item in TODO.md). Drop this line then.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, experimental: false }
          - { name: macOS, os: macos-latest, experimental: false }
          - { name: Windows, os: windows-latest, experimental: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed by job (OS) automatically; failures still save the build so a
      # retry starts warm. The toolchain version is part of the key too.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Linux build needs: a C++ toolchain, cmake and ninja (cef-dll-sys builds
      # libcef_dll_wrapper), libclang (bindgen), fontconfig (Slint text),
      # dbus (keyring), Wayland/X11/xkbcommon (winit, which loads them at run
      # time but is linked against their headers' packages by some crates),
      # and the libraries libcef.so links against (nss, gtk, atk, cups, gbm,
      # alsa), since test binaries link libcef.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libclang-dev \
            libfontconfig1-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libnss3-dev libgtk-3-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libgbm-dev libasound2-dev

      - name: Find the CEF version
        id: cef
        run: echo "version=$(awk '/^name = "cef-dll-sys"/{getline; print $3}' Cargo.lock | tr -d '"')" >> "$GITHUB_OUTPUT"

      # cef-dll-sys forces the CMake "Ninja" generator on every OS; install it
      # rather than rely on what the runner image ships (no-op if present).
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      # Windows has no rpath: test binaries run from target/debug/deps (or, with
      # newer cargo, target/debug/build/<pkg>/<hash>/out) and need
      # libcef.dll, which cef-dll-sys copies into target/debug.
      - name: Put libcef.dll on PATH (Windows)
        if: runner.os == 'Windows'
        run: cygpath -w "$PWD/target/debug" >> "$GITHUB_PATH"

      # Restore and save are split so the download is stored even when a later
      # step fails (actions/cache alone saves only on success).
      - name: Restore prebuilt CEF
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Headless GPU tests skip themselves when the runner has no adapter. No
      # step here opens a window or measures speed: smoke modes are run by hand.
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

      - name: Save prebuilt CEF
        if: always() && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
