<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="840" height="350" role="img" aria-labelledby="t d">
<title id="t">How wubble works</title>
<desc id="d">Zero-copy GPU frame pipeline from Chromium through a shared GPU texture and wgpu import into Slint, paired with a pure Rust state machine that emits effects executed at the edge.</desc>

  <defs>
    <clipPath id="card"><rect width="840" height="350" rx="20"/></clipPath>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC8FF"/>
      <stop offset=".35" stop-color="#B8A6FF"/>
      <stop offset=".68" stop-color="#FF9ED8"/>
      <stop offset="1" stop-color="#8AF2D0"/>
    </linearGradient>
    <linearGradient id="filmV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC8FF"/>
      <stop offset=".36" stop-color="#B8A6FF"/>
      <stop offset=".68" stop-color="#FF9ED8"/>
      <stop offset="1" stop-color="#8AF2D0"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".11"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282C3A" stop-opacity=".94"/>
      <stop offset="1" stop-color="#1A1D28" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="peekGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F42" stop-opacity=".92"/>
      <stop offset="1" stop-color="#1E2230" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="dyeBlue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2F5FC4" stop-opacity=".58"/>
      <stop offset="1" stop-color="#2F5FC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dyeViolet" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7563D8" stop-opacity=".50"/>
      <stop offset="1" stop-color="#7563D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dyeTeal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#237E69" stop-opacity=".46"/>
      <stop offset="1" stop-color="#237E69" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dyeMagenta" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A84886" stop-opacity=".34"/>
      <stop offset="1" stop-color="#A84886" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC8FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#B8A6FF" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="heroMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AF2D0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7CC8FF" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="heroBlush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9ED8" stop-opacity=".82"/>
      <stop offset="1" stop-color="#B8A6FF" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <filter id="softGlow" x="-120%" y="-180%" width="340%" height="460%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
<style>
  .pkt{animation:run 3.2s linear infinite}
  .pkt2{animation-delay:-1.07s}
  .pkt3{animation-delay:-2.13s}
  @keyframes run{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(756px);opacity:0}}
  .pu{animation:pu 3.2s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes pu{0%,100%{transform:scale(1)}10%{transform:scale(1.035)}24%{transform:scale(1)}}
  .pr{animation:pr 3.2s ease-out infinite}
  @keyframes pr{0%,100%{opacity:0}10%{opacity:.95}38%{opacity:0}}
  .hop{animation:hop 2.4s linear infinite}
  .hop2{animation-delay:-1.2s}
  @keyframes hop{0%{transform:translateX(0);opacity:0}12%{opacity:1}78%{opacity:1}92%,100%{transform:translateX(54px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{transform:translateX(210px)!important;opacity:1!important}.pkt2{transform:translateX(420px)!important;opacity:1!important}.pkt3{transform:translateX(620px)!important;opacity:1!important}.pr{opacity:.45!important}}
</style>

  <g clip-path="url(#card)">
    <rect width="840" height="350" fill="#08090D"/>
    <ellipse cx="118" cy="63" rx="260" ry="180" fill="url(#dyeBlue)" opacity=".65"/>
    <ellipse cx="739" cy="294" rx="250" ry="170" fill="url(#dyeMagenta)" opacity=".7"/>
    <ellipse cx="655" cy="35" rx="190" ry="120" fill="url(#dyeTeal)" opacity=".55"/>
    <rect width="840" height="350" fill="url(#glassTop)" opacity=".35"/>
  </g>

<!-- Section 1 Header: GPU Frame Path -->
<g transform="translate(38 36)">
  <circle cx="5" cy="-3.5" r="3.5" fill="#7CC8FF"/>
  <text x="16" y="0" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#CFE7FF" letter-spacing=".8">ZERO-COPY GPU FRAME PATH</text>
  <rect x="520" y="-15" width="244" height="22" rx="11" fill="#8AF2D0" fill-opacity=".10" stroke="#8AF2D0" stroke-opacity=".28"/>
  <text x="642" y="-0.5" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.2" font-weight="600" fill="#8AF2D0" text-anchor="middle">0 CPU readbacks · 120 Hz (8.33 ms)</text>
</g>

<!-- Connectors between GPU nodes -->
<g stroke="#3A4259" stroke-width="1.8" stroke-linecap="round" fill="none">
  <path d="M194 96 H234 M229 91.5 L235 96 L229 100.5"/>
  <path d="M398 96 H438 M433 91.5 L439 96 L433 100.5"/>
  <path d="M602 96 H642 M637 91.5 L643 96 L637 100.5"/>
</g>

<!-- GPU Rail + Glowing Frame Packets -->
<line x1="42" y1="158" x2="798" y2="158" stroke="#252B3C" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
<line x1="114" y1="128" x2="114" y2="152" stroke="#2A3144" stroke-width="1.5"/><line x1="318" y1="128" x2="318" y2="152" stroke="#2A3144" stroke-width="1.5"/><line x1="522" y1="128" x2="522" y2="152" stroke="#2A3144" stroke-width="1.5"/><line x1="726" y1="128" x2="726" y2="152" stroke="#2A3144" stroke-width="1.5"/>


<g transform="translate(114 96)">
  <g class="pu" style="animation-delay:0.35s">
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="#131622" stroke="#2C3347"/>
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="url(#glassTop)"/>
    <rect class="pr" style="animation-delay:0.35s" x="-75.25" y="-31.25" width="150.5" height="62.5" rx="12.5" fill="none" stroke="url(#film)" stroke-width="1.6" opacity="0"/>
    <text x="0" y="-12" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#7CC8FF" text-anchor="middle" letter-spacing=".8">RENDER</text>
    <text x="0" y="5" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2F4FA" text-anchor="middle">Chromium</text>
    <text x="0" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">CEF · windowless</text>
  </g>
</g>
<g transform="translate(318 96)">
  <g class="pu" style="animation-delay:1.15s">
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="#131622" stroke="#2C3347"/>
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="url(#glassTop)"/>
    <rect class="pr" style="animation-delay:1.15s" x="-75.25" y="-31.25" width="150.5" height="62.5" rx="12.5" fill="none" stroke="url(#film)" stroke-width="1.6" opacity="0"/>
    <text x="0" y="-12" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#7CC8FF" text-anchor="middle" letter-spacing=".8">HANDLE</text>
    <text x="0" y="5" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2F4FA" text-anchor="middle">Shared GPU</text>
    <text x="0" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">DMA-BUF / IOSurface</text>
  </g>
</g>
<g transform="translate(522 96)">
  <g class="pu" style="animation-delay:1.95s">
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="#131622" stroke="#2C3347"/>
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="url(#glassTop)"/>
    <rect class="pr" style="animation-delay:1.95s" x="-75.25" y="-31.25" width="150.5" height="62.5" rx="12.5" fill="none" stroke="url(#film)" stroke-width="1.6" opacity="0"/>
    <text x="0" y="-12" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#7CC8FF" text-anchor="middle" letter-spacing=".8">TEXTURE</text>
    <text x="0" y="5" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2F4FA" text-anchor="middle">wgpu</text>
    <text x="0" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">Zero-copy import</text>
  </g>
</g>
<g transform="translate(726 96)">
  <g class="pu" style="animation-delay:2.75s">
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="#131622" stroke="#2C3347"/>
    <rect x="-76" y="-32" width="152" height="64" rx="13" fill="url(#glassTop)"/>
    <rect class="pr" style="animation-delay:2.75s" x="-75.25" y="-31.25" width="150.5" height="62.5" rx="12.5" fill="none" stroke="url(#film)" stroke-width="1.6" opacity="0"/>
    <text x="0" y="-12" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#7CC8FF" text-anchor="middle" letter-spacing=".8">PRESENT</text>
    <text x="0" y="5" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F2F4FA" text-anchor="middle">Slint Scene</text>
    <text x="0" y="20" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">UI + GPU glass</text>
  </g>
</g>

<g transform="translate(42 158)">
  <g class="pkt"><ellipse rx="10" ry="5" fill="url(#film)" filter="url(#softGlow)"/><ellipse cx="-3" cy="-1.5" rx="3.2" ry="1.3" fill="#FFFFFF" fill-opacity=".85"/></g>
  <g class="pkt pkt2"><ellipse rx="10" ry="5" fill="url(#film)" filter="url(#softGlow)"/><ellipse cx="-3" cy="-1.5" rx="3.2" ry="1.3" fill="#FFFFFF" fill-opacity=".85"/></g>
  <g class="pkt pkt3"><ellipse rx="10" ry="5" fill="url(#film)" filter="url(#softGlow)"/><ellipse cx="-3" cy="-1.5" rx="3.2" ry="1.3" fill="#FFFFFF" fill-opacity=".85"/></g>
</g>

<!-- Divider -->
<line x1="38" y1="190" x2="802" y2="190" stroke="#FFFFFF" stroke-opacity=".07"/>

<!-- Section 2 Header: Pure State Machine -->
<g transform="translate(38 220)">
  <circle cx="5" cy="-3.5" r="3.5" fill="#B8A6FF"/>
  <text x="16" y="0" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#DCD3FF" letter-spacing=".8">DECLARATIVE STATE &amp; EFFECTS</text>
  <text x="764" y="0" font-family="ui-monospace, 'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#8C93A8" text-anchor="end">transition(state, event) → (state, effects)</text>
</g>

<!-- Connectors -->
<line x1="266" y1="274" x2="320" y2="274" stroke="#2D3448" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<line x1="520" y1="274" x2="574" y2="274" stroke="#2D3448" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
<g transform="translate(266 274)"><g class="hop" opacity="0"><ellipse rx="6.5" ry="3.8" fill="url(#film)"/></g></g>
<g transform="translate(520 274)"><g class="hop hop2" opacity="0"><ellipse rx="6.5" ry="3.8" fill="url(#film)"/></g></g>


<g transform="translate(166 274)">
  <rect x="-98" y="-29" width="196" height="58" rx="13" fill="#131622" stroke="#2C3347"/>
