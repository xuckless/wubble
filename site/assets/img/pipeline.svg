  <text x="0" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">Execute at the edge</text>
</g>

<text x="420" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#7E8496" text-anchor="middle">Pure logic in wubble-core · only wubble-engine and wubble-gfx touch CEF or the GPU</text>
