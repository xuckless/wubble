  <text x="0" y="-2" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">wubble-core</text>
  <text x="0" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">Tabs, Spaces, sleep, motion</text>
</g>
<g transform="translate(420 274)">
  <rect x="-98" y="-29" width="196" height="58" rx="13" fill="#131622" stroke="#2C3347"/>
  <rect x="-98" y="-29" width="196" height="58" rx="13" fill="url(#glassTop)"/>
  <circle cx="-80" cy="-6" r="3.2" fill="#B8A6FF"/>
  <text x="0" y="-2" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F2F4FA" text-anchor="middle">Effects</text>
  <text x="0" y="15" font-family="ui-sans-serif, system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8C93A8" text-anchor="middle">Pure values · zero I/O</text>
</g>
<g transform="translate(674 274)">
  <rect x="-98" y="-29" width="196" height="58" rx="13" fill="#131622" stroke="#2C3347"/>
  <rect x="-98" y="-29" width="196" height="58" rx="13" fill="url(#glassTop)"/>
