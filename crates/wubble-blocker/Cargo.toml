[package]
name = "wubble-blocker"
description = "Content blocking on Brave's adblock-rust: network decisions, cosmetic rules, per-site shields."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# default-features = false drops `single-thread`, which would make Engine !Send/!Sync.
adblock = { version = "0.13", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling"] }
# `css-validation` parses selectors, which is how adblock tells procedural
# filters (`:has-text`, `:upward`, ...) from plain CSS, as Brave builds it.
# The settings' defaults (`catalog::Selection::default`).
wubble-core.workspace = true
serde_json.workspace = true
thiserror = "2"
url = "2"
# Fetches filter lists, only when `blocker.lists_auto_update` is on; already in
# Cargo.lock through cef-dll-sys.
ureq = "3"

[dev-dependencies]
# The `redirects` example only (no extra dependencies).
adblock = { version = "0.13", default-features = false, features = ["resource-assembler"] }
