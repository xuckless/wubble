[package]
name = "wubble-release"
description = "Release tooling: the update key, signatures and the update manifest (docs/release.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The manifest's one schema (`update::manifest`). No CEF, GPU or UI: CI builds this crate alone.
wubble-core.workspace = true
# Key pairs and signatures in minisign's format, so the `minisign` CLI verifies them (MIT,
# jedisct1/rust-minisign).
minisign = "0.10"
sha2 = "0.11"
clap.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
