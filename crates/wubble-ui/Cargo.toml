[package]
name = "wubble-ui"
description = "Slint shell: sidebar, tabs, spaces, command bar. Web content appears as images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
slint.workspace = true
wubble-core.workspace = true

# AppKit's window restoration and automatic window tabbing turned off
# (`window::no_os_window_restoration`, `window::no_automatic_tabbing`); already in Cargo.lock
# (Zlib OR Apache-2.0 OR MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "1.19"
# The renderer itself (Skia on wgpu), offscreen, for the crisp text test (tests/crisp_text.rs);
# the same release the `slint` pin pulls in.
i-slint-renderer-skia = "=1.19.0"
wgpu.workspace = true
# Reads the web curves (tools/fidelity/curves/*.json) in tests/motion_curves.rs.
serde_json.workspace = true
