[package]
name = "wubble-ui"
description = "Slint shell: sidebar, tabs, spaces, command bar. Web content appears as images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
slint.workspace = true
wubble-core.workspace = true

# AppKit's window restoration turned off (`window::no_os_window_restoration`); already in
# Cargo.lock through winit (Zlib OR Apache-2.0 OR MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "1.19"
# The renderer itself, offscreen, for the crisp text test (tests/crisp_text.rs): the vendored
# copy through the workspace's [patch.crates-io].
i-slint-renderer-femtovg = { version = "1.19", features = ["wgpu-30"] }
wgpu.workspace = true
