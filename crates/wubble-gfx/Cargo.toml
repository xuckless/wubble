[package]
name = "wubble-gfx"
description = "Zero-copy frame handoff: CEF accelerated OSR -> wgpu texture -> Slint image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
slint.workspace = true
wgpu.workspace = true
welding.workspace = true
# GPU timestamps of the scene's frames, for the quality governor (MIT OR Apache-2.0).
wgpu-profiler = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
# The page's CALayer (layer.rs); versions already in the lock file (objc2 MIT, the framework
# crates Zlib OR Apache-2.0 OR MIT).
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The page's Wayland subsurface (layer.rs), on winit's connection: the versions already in the
# lock file through Slint's winit backend (MIT).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[dev-dependencies]
# WGSL validation of the scene shaders in tests; same version wgpu 30 uses.
naga = { version = "30", features = ["wgsl-in"] }
# The HDR surface spike (examples/hdr_surface.rs). Versions already in the lock file.
winit = "0.30"
pollster = "0.4"
