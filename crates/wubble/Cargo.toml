[package]
name = "wubble"
description = "The wubble browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wubble-core.workspace = true
wubble-engine.workspace = true
wubble-gfx.workspace = true
wubble-ui.workspace = true
slint.workspace = true
clap.workspace = true
wubble-store.workspace = true
wubble-blocker.workspace = true
# Drives the store's async methods on its own thread; already in Cargo.lock
# through wubble-store's tests.
pollster = "0.4"
# The page's file chooser: the XDG desktop portal (libdbus loaded at run time,
# zenity as fallback) on Linux, native dialogs on macOS and Windows (MIT).
rfd = "0.18"
# "Show in folder" for a download (MIT OR Apache-2.0).
opener = { version = "0.9", features = ["reveal"] }
# The OS downloads directory (MIT OR Apache-2.0).
dirs = "6"
# Console messages at debug level; no logger is installed by default (MIT OR Apache-2.0).
log = "0.4"

[dev-dependencies]
tempfile = "3"
