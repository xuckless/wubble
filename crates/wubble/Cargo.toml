[package]
name = "wubble"
description = "The wubble browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wubble-core.workspace = true
# `--smoke video` finds the video strip's buttons on screen by their element ids (debug builds
# carry them); the release the `slint` pin pulls in (GPL-3.0-only, as Slint; already in Cargo.lock
# through wubble-ui's tests).
i-slint-backend-testing = { version = "=1.19.0", default-features = false }
# Slint's platform (`slint_backend.rs`): the winit backend the selector builds, wrapped so that the
# shell's text fields use the host's clipboard; the core crate names the platform trait's hidden
# arguments. The releases the `slint` pin pulls in (GPL-3.0-only, as Slint; in Cargo.lock), with
# the features `slint` turns on.
i-slint-backend-winit = { version = "=1.19.0", default-features = false }
i-slint-core = { version = "=1.19.0", default-features = false }
# Partial rendering's switch and counts (`partial.rs`); vendored, see the root Cargo.toml's patch.
i-slint-renderer-skia = { version = "=1.19.0", default-features = false }
# Pages for screen readers (`host/ax.rs`).
wubble-ax.workspace = true
wubble-engine.workspace = true
wubble-gfx.workspace = true
wubble-ui.workspace = true
slint.workspace = true
clap.workspace = true
wubble-store.workspace = true
wubble-blocker.workspace = true
wubble-vault.workspace = true
# Memory pressure and the Task manager's process meter.
wubble-sysmem.workspace = true
# The autofill fill message (`host/autofill.rs`).
serde_json.workspace = true
# Passwords handed to the vault (`host/autofill.rs`, the passwords page); already in Cargo.lock.
zeroize = "1"
# Drives the store's async methods on its own thread; already in Cargo.lock
# through wubble-store's tests.
pollster = "0.4"
# The page's file chooser: the XDG desktop portal (libdbus loaded at run time,
# zenity as fallback) on Linux, native dialogs on macOS and Windows (MIT).
rfd = "0.18"
# "Show in folder" for a download (MIT OR Apache-2.0).
opener = { version = "0.9", features = ["reveal"] }
# The OS downloads directory (MIT OR Apache-2.0).
dirs = "6"
# The printer jobs' private temp folder (`host/print.rs`); MIT/Apache-2.0, already in Cargo.lock.
tempfile = "3"
# The local UTC offset for the history page's day groups; only the clock (MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The live suggestion fetch (`suggest_fx.rs`, HTTPS only) and SponsorBlock's lookup
# (`sponsor_net.rs`); already in Cargo.lock through wubble-blocker (MIT OR Apache-2.0).
ureq = "3"
# `--smoke media`: seals the AES-128 fixture (the same crates as wubble-core's HLS decryption,
# MIT OR Apache-2.0) and checks the saved files' SHA-256 (MIT OR Apache-2.0); all in Cargo.lock.
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
sha2 = "0.11"
# Console messages at debug level; no logger is installed by default (MIT OR Apache-2.0).
log = "0.4"
# Screenshots (`shot_io.rs`): Chromium's PNG arrives base64; decoded to RGBA for the clipboard.
# Both already in Cargo.lock (MIT OR Apache-2.0).
base64 = "0.22"
png = "0.18"
# An image on the clipboard (Slint's own clipboard is text only). Already in Cargo.lock through
# Slint's winit backend; `wayland-data-control` copies on Wayland (MIT OR Apache-2.0).
arboard = { version = "3.7", features = ["image-data", "wayland-data-control"] }
# The SponsorBlock endpoint's host (loopback or not); a workspace dependency already.
url.workspace = true
# Media keys and the system's media controls: MPRIS over zbus on Linux (pure Rust, no libdbus;
# zbus is already in Cargo.lock), the Now Playing centre on macOS, SMTC on Windows (MIT).
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
# The updater (`updater/`): its archives are `.tar.xz`, unpacked with tar (MIT OR Apache-2.0,
# already in Cargo.lock through download-cef) and lzma-rs (MIT, pure Rust). `--smoke update`
# signs its own fake release with wubble-release (minisign, MIT).
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"
wubble-release.workspace = true
# The current user's id for the MCP manifest checks (`mcp::private_to_me`); already in
# Cargo.lock (MIT OR Apache-2.0).
libc = "0.2"
# Single instance: a local socket in the profile (Unix domain socket, Windows named pipe);
# 0BSD OR Apache-2.0.
interprocess = "2.2"
# Agent sessions over MCP (`mcp.rs`, `host/agent.rs`): the protocol, and the session token's
# randomness from the OS (rand 0.8, as wubble-vault; MIT OR Apache-2.0).
wubble-mcp.workspace = true
rand = "0.8"

# CEF's pump requests through the main dispatch queue (`ui_loop.rs`); already in Cargo.lock
# through winit's AppKit backend (Zlib OR Apache-2.0 OR MIT).
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
# The OS reduced-motion preference (`os_motion.rs`); the version already in Cargo.lock through
# wubble-ui and wubble-engine (Zlib OR Apache-2.0 OR MIT).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView"] }
# Drags out of and into the window (`wl/macos.rs`): the versions already in Cargo.lock through
# objc2-app-kit and winit (MIT; raw-window-handle MIT OR Apache-2.0 OR Zlib).
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSError", "NSGeometry", "NSObject", "NSString", "NSURL"] }
block2 = "0.6"
raw-window-handle = "0.6"

# The OS reduced-motion preference (`os_motion.rs`, "Animation effects"); the version already in
# Cargo.lock through wubble-sysmem (MIT OR Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The system clipboard and primary selection, drops from and drags to other apps, touchpad pinch
# and swipe and the lock keys, on the windows' Wayland connection (`wl/wayland.rs`, ported from
# smithay-clipboard): smithay-client-toolkit and wayland-backend, the versions already in
# Cargo.lock through Slint's winit backend (MIT).
sctk = { package = "smithay-client-toolkit", version = "0.20", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
# The OS reduced-motion preference through the XDG Settings portal (`os_motion.rs`); already in
# Cargo.lock through souvlaki (MIT).
zbus = "5"

# The exe's icon on Windows (`build.rs`); MIT.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# `--measure memory` reports the Rust heap through a counting global allocator
# (`alloc_count.rs`); off by default, no dependency.
alloc-count = []
