<!doctype html>
<meta charset="utf-8">
<title>spell</title>
<style>
  body { margin: 0; }
  textarea { position: absolute; left: 20px; top: 20px; width: 400px; height: 120px; padding: 4px; font: 24px monospace; }
</style>
<textarea spellcheck="true" lang="en-US"></textarea>
<form action="/login" method="post" style="position:absolute;top:200px">
  <input name="user" autocomplete="username"><input name="pass" type="password" autocomplete="current-password">
</form>
<script>
  // The smoke reads these lines from the console.
  const box = document.querySelector('textarea');
  box.addEventListener('focus', () => console.log('spell: focused'));
  box.addEventListener('input', () => console.log('spell: input ' + JSON.stringify(box.value)));
  console.log('spell: ready');
</script>
