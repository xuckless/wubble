<!doctype html>
<!-- `wubble --measure resize`: an animated page whose layout follows the
     viewport (a border at its edges), while the window resizes itself.
     Bundled; loads nothing. -->
<html>
<head>
<meta charset="utf-8">
<title>wubble measure resize</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { box-sizing: border-box; border: 8px solid #e0457b; background: #f4f6ff;
         font: 600 28px system-ui, sans-serif; color: #111114; }
  #size { position: absolute; left: 24px; top: 24px; }
  #bar { position: absolute; left: 0; bottom: 24px; height: 24px; width: 25%;
         background: #7aa2ff; animation: slide 2s ease-in-out infinite alternate; }
  @keyframes slide { to { left: 75%; } }
</style>
</head>
<body>
<div id="size"></div>
<div id="bar"></div>
<script>
  const size = document.getElementById("size");
  function draw() {
    size.textContent = innerWidth + " x " + innerHeight;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
