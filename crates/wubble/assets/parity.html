<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>wubble parity</title>
<style>
/* `--smoke parity` (parity.rs) clicks these by position: keep them in step
   with the constants there. Logical px from the view's top left. */
body { margin: 0; background: #101820; color: #e8eef4; font: 16px sans-serif; }
#spacer { position: absolute; left: 0; top: 0; width: 3000px; height: 3000px; }
.at { position: absolute; box-sizing: border-box; }
input, textarea, [contenteditable] { font: 16px monospace; }
#inp { left: 20px; top: 20px; width: 240px; height: 28px; }
#inp2 { left: 20px; top: 60px; width: 240px; height: 28px; }
#ta { left: 20px; top: 100px; width: 240px; height: 60px; }
#ce { left: 20px; top: 180px; width: 240px; height: 40px; border: 1px solid #567; }
#para { left: 20px; top: 240px; margin: 0; font: 16px monospace; white-space: nowrap; }
#link { left: 20px; top: 290px; }
#img { left: 20px; top: 330px; width: 40px; height: 40px; }
#video { left: 100px; top: 330px; width: 120px; height: 60px; background: #333; }
#drag { left: 320px; top: 20px; width: 80px; height: 40px; background: #456; }
#drop { left: 320px; top: 100px; width: 160px; height: 80px; background: #354; }
#file { left: 320px; top: 200px; width: 200px; }
#filezone { left: 320px; top: 240px; width: 160px; height: 60px; background: #534; }
#copybtn { left: 520px; top: 20px; width: 100px; height: 30px; }
#dl { left: 520px; top: 80px; }
#blank { left: 520px; top: 120px; }
#mail { left: 520px; top: 160px; }
#blankwin { left: 520px; top: 200px; }
#open { left: 520px; top: 240px; width: 100px; height: 30px; }
#tip { left: 520px; top: 290px; width: 100px; height: 30px; background: #445; }
/* The page's own copy buttons, one per way a page writes the clipboard. */
#clip1, #clip2, #clip3, #clip4 { top: 410px; width: 90px; height: 30px; }
#clip1 { left: 20px; } #clip2 { left: 120px; } #clip3 { left: 220px; } #clip4 { left: 320px; }
#frameok, #frameno { top: 460px; width: 280px; height: 60px; border: 0; }
#frameok { left: 20px; } #frameno { left: 320px; }
</style>
</head>
<body>
<div id="spacer"></div>
<input id="inp" class="at">
<input id="inp2" class="at">
<textarea id="ta" class="at"></textarea>
<div id="ce" class="at" contenteditable="true"></div>
<p id="para" class="at">alpha beta gamma</p>
<a id="link" class="at" href="https://example.invalid/linked">a link</a>
<img id="img" class="at" alt="img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEUlEQVR4nGM4YWODFTEMLQkAZZlQAVIPr1MAAAAASUVORK5CYII=">
<video id="video" class="at" src="data:video/webm,"></video>
<div id="drag" class="at" draggable="true">drag me</div>
<div id="drop" class="at">drop here</div>
<input id="file" class="at" type="file" multiple>
<div id="filezone" class="at">files here</div>
<button id="copybtn" class="at">copy</button>
<a id="dl" class="at" download="parity.txt" href="data:text/plain,parity%20download">download</a>
<a id="blank" class="at" target="_blank" href="https://example.invalid/blank">blank</a>
<a id="mail" class="at" href="mailto:nobody@example.invalid">mail</a>
<a id="blankwin" class="at" href="https://example.invalid/b">b</a>
<button id="open" class="at">window.open</button>
<div id="tip" class="at" title="tip text">tooltip</div>
<button id="clip1" class="at">writeText</button>
<button id="clip2" class="at">execCommand</button>
<button id="clip3" class="at">write</button>
<button id="clip4" class="at">copy event</button>
<iframe id="frameok" class="at" allow="clipboard-write"></iframe>
<iframe id="frameno" class="at"></iframe>
<script>
const $ = (id) => document.getElementById(id);
// What the page saw, for the smoke's checks.
const seen = { keys: [], drops: [], files: [], custom: [], effect: '', dragstart: 0, grab: false, neutral: 0 };
// The page's pixel ratio at 100 %: browser zoom scales it.
const dpr = devicePixelRatio;
const parity = {
  // The view has its full size: every point parity.rs names is inside it.
  sized() { return (innerWidth > 800 && innerHeight > 600) || `view ${innerWidth}x${innerHeight}`; },
  // Zoom is back at 100 % in the page itself, not only asked for.
  unzoomed() { return devicePixelRatio === dpr || `pixel ratio ${devicePixelRatio}, not ${dpr}`; },
  // Each answer is a new title: `parity:<serial>:ok` or `parity:<serial>:fail:<why>`.
  answer(serial, r) {
    document.title = `parity:${serial}:` + (r === true ? 'ok' : 'fail:' + String(r).slice(0, 200));
  },
  check(serial, f) {
    let r;
    try { r = f(); } catch (e) { r = 'threw ' + e; }
    parity.answer(serial, r);
  },
  run(serial, f) {
    try { f(); parity.answer(serial, true); } catch (e) { parity.answer(serial, 'threw ' + e); }
  },
  // A field emptied and focused, with `text` in it and the caret at its end.
  field(id, text) {
    const el = $(id);
    el.focus();
    if (el.isContentEditable) { el.textContent = text; } else { el.value = text; }
    const end = text.length;
    if (el.isContentEditable) {
      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      getSelection().removeAllRanges(); getSelection().addRange(r);
    } else { el.setSelectionRange(end, end); }
  },
  // `text` in the field, all of it selected.
  selectField(id, text) {
    const el = $(id);
    el.focus(); el.value = text; el.setSelectionRange(0, text.length);
  },
  // Plain text selected in the paragraph (`from`..`to`).
  select(from, to) {
    document.activeElement && document.activeElement.blur();
    const t = $('para').firstChild;
    const r = document.createRange(); r.setStart(t, from); r.setEnd(t, to);
    getSelection().removeAllRanges(); getSelection().addRange(r);
  },
  reset() {
    seen.keys = []; seen.drops = []; seen.files = []; seen.custom = []; seen.effect = ''; seen.dragstart = 0; seen.grab = false; seen.neutral = 0; seen.clip = {}; seen.copied = '';
    getSelection().removeAllRanges();
    document.activeElement && document.activeElement.blur();
    scrollTo(0, 0);
  },
};
// Got `a`, wanted `b`: true, or what was seen.
const eq = (a, b) => a === b || `got ${JSON.stringify(a)} want ${JSON.stringify(b)}`;
addEventListener('mousedown', (e) => {
  seen.down = `${e.target.id || e.target.tagName}@${e.clientX},${e.clientY}/${e.button}/${e.detail}`;
  // The reset's second neutral click (parity.rs `at::NEUTRAL`): nothing else is right of 720.
  if (e.isTrusted && e.button === 0 && e.clientX >= 720) seen.neutral++;
}, true);
addEventListener('keydown', (e) => {
  seen.keys.push((e.ctrlKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey ? 'Shift+' : '') + (e.metaKey ? 'Cmd+' : '') + e.key + '/' + e.code);
  // A page that owns Ctrl+F (a web app's own search) when asked to.
  if (seen.grab && (e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); seen.keys.push('grabbed'); }
});
$('drag').addEventListener('dragstart', (e) => {
  seen.dragstart++;
  e.dataTransfer.setData('text/plain', 'payload');
  e.dataTransfer.setData('application/x-wubble', 'custom');
});
// What a drag out of the first field did there (the drop target's choice).
$('inp').addEventListener('dragend', (e) => { seen.effect = e.dataTransfer.dropEffect; });
$('drop').addEventListener('dragover', (e) => e.preventDefault());
$('drop').addEventListener('drop', (e) => {
  e.preventDefault();
  seen.drops.push(e.dataTransfer.getData('text/plain'));
  seen.custom.push(e.dataTransfer.getData('application/x-wubble'));
});
$('filezone').addEventListener('dragover', (e) => e.preventDefault());
$('filezone').addEventListener('drop', (e) => { e.preventDefault(); seen.files = [...e.dataTransfer.files].map((f) => f.name); });
$('copybtn').addEventListener('click', () => {
  const t = document.createElement('textarea'); t.value = 'from execCommand'; document.body.append(t);
  t.select(); document.execCommand('copy'); t.remove();
});
// The page's own copies (`seen.clip[name]`: 'ok', or the rejection's name and message).
seen.clip = {};
const clipDone = (name, p) => {
  seen.clip[name] = 'pending';
  Promise.resolve(p).then(
    (v) => { seen.clip[name] = v === false ? 'false' : 'ok'; },
    (e) => { seen.clip[name] = `${e && e.name}: ${e && e.message}`; },
  ).finally(() => console.log(`parity clip ${name}: ${seen.clip[name]}`));
};
// A textarea out of sight, as Angular CDK's Clipboard and most copy buttons use.
const execCopy = (text) => {
  const t = document.createElement('textarea'); t.value = text;
  t.style.cssText = 'position: fixed; top: -999em; opacity: 0;';
  document.body.append(t); t.focus(); t.select();
  try { return document.execCommand('copy'); } finally { t.remove(); }
};
$('clip1').addEventListener('click', () => clipDone('a1', navigator.clipboard.writeText('a1')));
$('clip2').addEventListener('click', () => clipDone('a2', execCopy('a2')));
$('clip3').addEventListener('click', () => clipDone('a3', navigator.clipboard.write([
  new ClipboardItem({ 'text/plain': new Blob(['a3'], { type: 'text/plain' }) })])));
// A selection and a `copy` listener that puts other text on the clipboard instead, as the
// `copy-to-clipboard` package does (`seen.copied`: what the listener set).
$('clip4').addEventListener('click', () => {
  const span = document.createElement('span'); span.textContent = 'a4 selected'; document.body.append(span);
  getSelection().selectAllChildren(span);
  const set = (e) => { e.clipboardData.setData('text/plain', 'a4'); seen.copied = 'a4'; e.preventDefault(); };
  document.addEventListener('copy', set, { once: true });
  try { clipDone('a4', document.execCommand('copy')); } finally {
    document.removeEventListener('copy', set); span.remove();
  }
});
// Two cross-origin frames (`localhost`, on this page's port), one allowed to write the
// clipboard: the same copy button in each posts its outcome here (`seen.clip['f-' + id]`).
for (const id of ['frameok', 'frameno']) $(id).src = `http://localhost:${location.port}/parity/frame#${id}`;
addEventListener('message', (e) => { if (e.data && e.data.clip) seen.clip['f-' + e.data.clip] = e.data.r; });
$('open').addEventListener('click', () => window.open('https://example.invalid/opened'));
window.name = String(Number(window.name || 0) + 1); // loads of this page, across reloads
</script>
</body>
</html>
