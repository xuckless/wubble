[package]
name = "wubble-core"
description = "Engine- and UI-agnostic browser model: tabs, spaces, sleep policy, session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
# Passwords in flight are wiped on drop (`secret`); already in Cargo.lock via wubble-vault.
zeroize = "1"
url.workspace = true
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# The registrable domain for tab tidy; already in Cargo.lock via adblock (wubble-blocker).
psl = "2"
# Media downloader (`media`): HLS playlists (MIT), DASH manifests (parser only, MIT; not
# `dash-mpd`, which pulls an HTTP client), and AES-128-CBC for plain HLS keys (MIT OR Apache-2.0,
# already in Cargo.lock).
m3u8-rs = "6.0.1"
dash-mpd-core = "0.1.0"
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
# The SponsorBlock lookup's hash prefix (`sponsor`); pure Rust, already in Cargo.lock (MIT OR Apache-2.0).
sha2 = "0.11"
