[package]
name = "wubble-engine"
description = "Chromium embedding layer (CEF, windowless). Hides CEF behind wubble's own API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wubble-core.workspace = true
wubble-gfx.workspace = true
# The media writer thread runs at background priority (`lower_current_thread`); also the GPU
# process's id for the gpu_crash_smoke example.
wubble-sysmem.workspace = true
welding.workspace = true
cef.workspace = true
dpi.workspace = true
# DevTools protocol messages (`cdp.rs`) and page-script answers.
serde_json.workspace = true
# Key and modifier types of the host's keyboard events (the same winit Slint
# uses). Default features: without a backend winit refuses to build alone.
winit = "0.30"

# Finds the patched CEF's `cef_wubble_ext_v1` among the loaded symbols (`ext_api.rs`); already in
# Cargo.lock through welding (ISC).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.1"

# The CEF-aware `NSApplication` subclass (`mac_app.rs`); both already in Cargo.lock through cef
# (MIT OR Apache-2.0 OR Zlib).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent"] }

[dev-dependencies]
# The ax_smoke example maps the accessibility tree it gets.
wubble-ax.workspace = true
# Seals the test segment the writer decrypts (wubble-core's own AES-128 crates).
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
# The local_probe example's WebSocket handshake (both already in Cargo.lock).
sha1_smol = "1.0.1"
base64 = "0.22"
